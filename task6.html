<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock</title>

    <style>
        /* =========================
           CSS
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #164e63, transparent 35%),
                radial-gradient(circle at bottom right, #4c1d95, transparent 35%),
                #020617;

            color: white;
            overflow: hidden;
        }

        /* Background circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(5px);
            opacity: 0.5;
            animation: float 6s ease-in-out infinite;
        }

        .circle-one {
            width: 180px;
            height: 180px;
            background: #06b6d4;
            top: 10%;
            left: 10%;
        }

        .circle-two {
            width: 220px;
            height: 220px;
            background: #8b5cf6;
            bottom: 5%;
            right: 8%;
            animation-delay: 2s;
        }

        /* Clock Container */
        .clock-container {
            position: relative;
            width: 90%;
            max-width: 750px;

            padding: 50px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 30px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.03);

            animation: appear 1s ease;
        }

        /* Heading */
        .clock-container h1 {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        /* Time */
        #clock {
            font-size: clamp(55px, 10vw, 105px);
            font-weight: bold;
            letter-spacing: 5px;

            background: linear-gradient(
                90deg,
                #22d3ee,
                #60a5fa,
                #a78bfa
            );

            -webkit-background-clip: text;
            color: transparent;

            text-shadow: 0 0 30px rgba(34, 211, 238, 0.15);
        }

        /* AM PM */
        #ampm {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 5px;
        }

        /* Date */
        #date {
            margin-top: 25px;

            color: #cbd5e1;
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* Divider */
        .divider {
            width: 100px;
            height: 3px;

            margin: 25px auto;

            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #22d3ee,
                #8b5cf6
            );
        }

        /* Status */
        .status {
            color: #64748b;
            font-size: 13px;
            letter-spacing: 2px;
        }

        .status span {
            color: #4ade80;
        }

        /* Animation */
        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .clock-container {
                padding: 40px 20px;
                border-radius: 22px;
            }

            .clock-container h1 {
                font-size: 16px;
                letter-spacing: 3px;
            }

            #clock {
                font-size: 48px;
                letter-spacing: 2px;
            }

            #ampm {
                font-size: 17px;
            }

            #date {
                font-size: 15px;
            }

            .circle-one {
                width: 120px;
                height: 120px;
            }

            .circle-two {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HTML
    ========================== -->

    <div class="circle circle-one"></div>
    <div class="circle circle-two"></div>

    <div class="clock-container">

        <h1>Digital Clock</h1>

        <div id="clock">
            00:00:00
        </div>

        <div id="ampm">
            AM
        </div>

        <div class="divider"></div>

        <div id="date">
            Loading date...
        </div>

        <div class="status">
            ● <span>LIVE</span> &nbsp; Real-Time Clock
        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        function updateClock() {

            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            // AM / PM
            const ampm = hours >= 12 ? "PM" : "AM";

            // Convert 24-hour to 12-hour
            hours = hours % 12;

            hours = hours ? hours : 12;

            // Add leading zero
            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");

            // Display time
            document.getElementById("clock").textContent =
                `${hours}:${minutes}:${seconds}`;

            // Display AM / PM
            document.getElementById("ampm").textContent = ampm;


            // Display Date
            const options = {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            };

            const date = now.toLocaleDateString(
                "en-US",
                options
            );

            document.getElementById("date").textContent = date;
        }


        // Update immediately
        updateClock();


        // Update every second
        setInterval(updateClock, 1000);

    </script>

</body>
</html>
